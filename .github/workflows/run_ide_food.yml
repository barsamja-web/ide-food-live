name: Run IDE-food Live Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 5 * *"

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify Python syntax
        run: |
          python -m py_compile ide_food_live.py

      - name: Download World Bank monthly Excel (curl)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --show-error --silent \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --output data/worldbank_monthly.xlsx \
            "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx"
          file data/worldbank_monthly.xlsx
          ls -lh data/worldbank_monthly.xlsx

      - name: Validate downloaded workbook
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import is_zipfile
          import pandas as pd

          path = Path('data/worldbank_monthly.xlsx')
          if not path.is_file() or path.stat().st_size < 10000 or not is_zipfile(path):
              raise SystemExit('ERROR: Downloaded file is absent, too small or not XLSX')
          workbook = pd.ExcelFile(path, engine='openpyxl')
          if 'Monthly Indices' not in workbook.sheet_names:
              raise SystemExit(f'ERROR: Monthly Indices missing; found: {workbook.sheet_names}')
          print('Validated workbook:', path, 'size:', path.stat().st_size)
          PYCODE

      - name: Run IDE-food monitor
        env:
          WB_LOCAL_XLSX: data/worldbank_monthly.xlsx
        run: |
          python ide_food_live.py

      - name: Commit outputs
        run: |
          set -euo pipefail
          git config user.name "ide-food-bot"
          git config user.email "ide-food-bot@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IDE-food live signal"
            git push
          fi
